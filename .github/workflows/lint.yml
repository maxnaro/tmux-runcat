name: Lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.rust == 'true' }}
      tmux: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.tmux == 'true' }}
      fonts: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.fonts == 'true' }}
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.windows == 'true' }}
      linux: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.linux == 'true' }}
      powershell: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.powershell == 'true' }}
      shell: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.shell == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.python == 'true' }}
      workflow: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            changed: ['**']
          list-files: json
      - run: python3 -m unittest discover -s .github/tests
      - id: selection
        run: python3 .github/scripts/ci.py select
        env:
          CHANGED_FILES: ${{ steps.paths.outputs.changed_files || '[]' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          predicate-quantifier: every
  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.rust == 'true'
        run: rustup component add rustfmt clippy
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets --locked --offline -- -D warnings
      - if: needs.changes.outputs.shell == 'true'
        run: |
          curl -fL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-v0.10.0:$PATH"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
          python3 .github/scripts/ci.py shell
      - if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - if: needs.changes.outputs.python == 'true'
        run: python -m pip install ruff==0.12.12
      - if: needs.changes.outputs.python == 'true'
        run: python3 .github/scripts/ci.py python
      - if: needs.changes.outputs.workflow == 'true'
        run: GOBIN="$RUNNER_TEMP/ci-tools/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - if: needs.changes.outputs.workflow == 'true'
        run: |
          # Always execute analysis, including on cache hits.
          go version
          "$RUNNER_TEMP/ci-tools/actionlint/actionlint" -version
          "$RUNNER_TEMP/ci-tools/actionlint/actionlint"
  powershell:
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - if: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ci-tools/modules" | Out-Null
          Save-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Path "$env:RUNNER_TEMP/ci-tools/modules" -Force
      - shell: powershell
        run: |
          Import-Module "$env:RUNNER_TEMP/ci-tools/modules/PSScriptAnalyzer/1.24.0/PSScriptAnalyzer.psd1" -ErrorAction Stop
          # Installation is skipped only on an exact cache hit.
          $findings = @(git ls-files '*.ps1' '*.psm1' '*.psd1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error })
          $findings | Format-Table -AutoSize
          if ($findings.Count) { throw 'PowerShell analysis failed.' }
