name: Lint
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "**/LICENSE"
      - "**/LICENSE.*"
      - "**/*-LICENSE"
      - "**/*-LICENSE.*"
      - "**/*-OFL.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "**/LICENSE"
      - "**/LICENSE.*"
      - "**/*-LICENSE"
      - "**/*-LICENSE.*"
      - "**/*-OFL.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - run: |
          curl -fL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-v0.10.0:$PATH"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
          bash -n runcat.tmux fonts/setup.sh
          shellcheck runcat.tmux fonts/setup.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.12.12
      - run: ruff check --select E9,F --target-version py311 fonts tests
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
  powershell:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path fonts -Recurse -Severity Error)
          $findings | Format-Table -AutoSize
          if ($findings.Count) { throw 'PowerShell analysis failed.' }
