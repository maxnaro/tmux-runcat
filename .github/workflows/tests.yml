name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.rust == 'true' }}
      tmux: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.tmux == 'true' }}
      fonts: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.fonts == 'true' }}
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.windows == 'true' }}
      linux: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.linux == 'true' }}
      powershell: ${{ github.event_name == 'workflow_dispatch' || steps.selection.outputs.powershell == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            changed: ['**']
          list-files: json
      - run: python3 -m unittest discover -s .github/tests
      - id: selection
        run: python3 .github/scripts/ci.py select
        env:
          CHANGED_FILES: ${{ steps.paths.outputs.changed_files || '[]' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          predicate-quantifier: every
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component llvm-tools-preview
      - run: rustup default ${{ matrix.rust }}
      - if: matrix.rust != 'stable'
        run: cargo test --all-targets --locked --offline
      - if: matrix.rust == 'stable'
        id: compiler
        run: echo "identity=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: matrix.rust == 'stable' && steps.runtime.outputs.image != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: coverage-tool
        with:
          path: ${{ runner.temp }}/ci-tools/llvm-cov
          key: llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-${{ steps.compiler.outputs.identity }}-0.6.21
      - if: matrix.rust == 'stable' && steps.coverage-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.6.21 --locked --root "$RUNNER_TEMP/ci-tools/llvm-cov"
      - if: matrix.rust == 'stable'
        run: |
          "$RUNNER_TEMP/ci-tools/llvm-cov/bin/cargo-llvm-cov" llvm-cov --version | grep -F "0.6.21"
          echo "$RUNNER_TEMP/ci-tools/llvm-cov/bin" >> "$GITHUB_PATH"
      - if: matrix.rust == 'stable'
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --all-targets --locked --offline --lcov --output-path target/coverage/rust.lcov
      - if: matrix.rust == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: target/coverage/rust.lcov
          retention-days: 14
          if-no-files-found: error
      - if: matrix.rust == 'stable'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: target/coverage/rust.lcov
          flags: rust
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
  tmux:
    needs: changes
    if: needs.changes.outputs.tmux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - if: steps.runtime.outputs.image != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tmux-cache
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-3.6-136db80c-v1
      - if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fL https://github.com/tmux/tmux/releases/download/3.6/tmux-3.6.tar.gz -o "$RUNNER_TEMP/tmux.tar.gz"
          echo "136db80cfbfba617a103401f52874e7c64927986b65b1b700350b6058ad69607  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.6"
          ./configure --prefix="$RUNNER_TEMP/tmux"
          make -j2
          make install
      - run: |
          "$RUNNER_TEMP/tmux/bin/tmux" -V
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --offline
      - run: |
          mapfile -d '' tests < <(find tests -type f -name '*_tmux.py' -print0)
          ((${#tests[@]} > 0)) || { echo 'No tmux tests found' >&2; exit 1; }
          for test in "${tests[@]}"; do
            python3 "$test"
          done
  fonts:
    needs: changes
    if: needs.changes.outputs.fonts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install coverage==7.10.7
      - run: |
          mkdir -p target/coverage
          python -c "import unittest; s = unittest.defaultTestLoader.discover('fonts/tests'); assert s.countTestCases(), 'No font tests found'"
          python -m coverage run -m unittest discover -s fonts/tests -p 'test_*.py'
          python -m coverage combine
          python -m coverage xml -o target/coverage/python.xml
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/target/coverage/.coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: target/coverage/python.xml
          retention-days: 14
          if-no-files-found: error
      - uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: target/coverage/python.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: runtime
        shell: bash
        run: |
          echo "image=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - shell: powershell
        run: |
          $tests = @(Get-ChildItem fonts/tests -Recurse -Filter 'test-*.ps1')
          if (-not $tests.Count) { throw 'No Windows tests found' }
          foreach ($test in $tests) { & $test.FullName }
